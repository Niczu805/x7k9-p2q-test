<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugzeugradar</title>
    
    <!-- Leaflet CSS für die Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        
        /* Header */
        header {
            background-color: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            height: 50px;
            box-sizing: border-box;
            z-index: 1000;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 13px;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #bbb;
        }

        /* Switch Toggle für Ton */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444; transition: .3s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(16px); }
        
        /* Kombinierter Status & Fehlerprotokoll Button */
        .status-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            border: 1px solid #333;
            color: #e0e0e0;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 13px;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .status-btn:hover {
            background-color: #333;
            border-color: #555;
        }
        .dot {
            height: 9px;
            width: 9px;
            background-color: #FFA500;
            border-radius: 50%;
            display: inline-block;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        /* Karten-Wrapper */
        .map-wrapper {
            position: relative;
            height: 45vh;
            width: 100%;
            border-bottom: 2px solid #2a2a2a;
        }

        #map {
            height: 100%;
            width: 100%;
            background-color: #121212;
        }

        /* Zentrieren Button */
        .center-btn {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        .center-btn:hover { background-color: #333; }

        /* Tabelle */
        .table-container {
            flex: 1;
            overflow-y: auto;
            background-color: #121212;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 10px 20px;
            text-align: left;
            border-bottom: 1px solid #1f1f1f;
            font-size: 13px;
        }
        th {
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            background-color: #161616;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background-color: #181818; }

        /* Hellere Hervorhebung für Flüge mit Ziel Stuttgart */
        tr.highlight-str {
            background-color: rgba(255, 215, 0, 0.25) !important;
            border-left: 4px solid #ffd700;
        }
        tr.highlight-str:hover {
            background-color: rgba(255, 215, 0, 0.35) !important;
        }

        .plane-thumb {
            width: 45px;
            height: 30px;
            object-fit: cover;
            border-radius: 4px;
            background: #222;
            display: block;
        }

        /* Fehlerprotokoll Fenster */
        #error-log-modal {
            display: none;
            position: fixed;
            top: 60px;
            right: 20px;
            width: 360px;
            max-height: 250px;
            background-color: #0b0b0b;
            border: 1px solid #333;
            border-radius: 8px;
            color: #ff5555;
            font-family: monospace;
            font-size: 11px;
            padding: 12px;
            overflow-y: auto;
            white-space: pre-wrap;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            z-index: 2000;
        }
        .log-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 4px;
            border-bottom: 1px solid #222;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
        }
        .close-log {
            cursor: pointer;
            color: #888;
        }
        .close-log:hover { color: #fff; }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>✈️</span> Flugzeugradar
        </div>
        <div class="header-controls">
            <div class="control-item">
                <span>Ton</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle">
                    <span class="slider"></span>
                </label>
            </div>
            
            <button class="status-btn" id="status-btn" onclick="toggleErrorLog()" title="Klicken für Fehlerprotokoll">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Lade...</span>
            </button>
        </div>
    </header>

    <div class="main-container">
        <!-- Karten-Wrapper -->
        <div class="map-wrapper">
            <div id="map"></div>
            <button class="center-btn" onclick="centerMap()">
                🎯 Zentrieren
            </button>
        </div>

        <!-- Tabelle -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>CALLSIGN</th>
                        <th>FOTO</th>
                        <th>ROUTE (START → ZIEL)</th>
                        <th>HÖHE</th>
                        <th>GESCHW.</th>
                        <th>DISTANZ</th>
                    </tr>
                </thead>
                <tbody id="flight-table-body">
                    <tr><td colspan="6" style="text-align: center; color: #666; padding: 30px;">Suche nach Live-Flugdaten...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Verstecktes Fehlerprotokoll Modal -->
    <div id="error-log-modal">
        <div class="log-header">
            <span>Fehlerprotokoll</span>
            <span class="close-log" onclick="toggleErrorLog()">✕</span>
        </div>
        <div id="error-log-content">Keine Fehler vorhanden.</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const CONFIG = {
            lat: 48.6912,
            lon: 9.1663
        };

        // 5.4 Nautische Meilen = ca. 10 km Radius
        const radiusNmi = 5.4; 
        const photoCache = {};
        const routeCache = {};
        const strSoundPlayed = new Set();

        const AIRPORT_CITIES = {
            'STR': 'Stuttgart', 'EDDS': 'Stuttgart',
            'FRA': 'Frankfurt', 'EDDF': 'Frankfurt',
            'MUC': 'München', 'EDDM': 'München',
            'BER': 'Berlin', 'EDDB': 'Berlin',
            'HAM': 'Hamburg', 'EDDH': 'Hamburg',
            'DUS': 'Düsseldorf', 'EDDL': 'Düsseldorf',
            'CGN': 'Köln/Bonn', 'EDDK': 'Köln/Bonn',
            'NRN': 'Weeze', 'EDLV': 'Weeze',
            'HAJ': 'Hannover', 'EDDV': 'Hannover',
            'NUE': 'Nürnberg', 'EDDN': 'Nürnberg',
            'FMO': 'Münster/Osnabrück', 'EDDG': 'Münster/Osnabrück',
            'LEJ': 'Leipzig/Halle', 'EDDP': 'Leipzig/Halle',
            'FDH': 'Friedrichshafen', 'EDNY': 'Friedrichshafen',
            'ZRH': 'Zürich', 'LSZH': 'Zürich',
            'BSL': 'Basel', 'LFSB': 'Basel', 'EAP': 'Basel',
            'GVA': 'Genf', 'LSGG': 'Genf',
            'VIE': 'Wien', 'LOWW': 'Wien',
            'PRG': 'Prag', 'LKPR': 'Prag',
            'BRU': 'Brüssel', 'EBBR': 'Brüssel',
            'AMS': 'Amsterdam', 'EHAM': 'Amsterdam',
            'CDG': 'Paris', 'LFPG': 'Paris',
            'ORY': 'Paris Orly', 'LFPO': 'Paris Orly',
            'LHR': 'London Heathrow', 'EGLL': 'London Heathrow',
            'LGW': 'London Gatwick', 'EGKK': 'London Gatwick',
            'STN': 'London Stansted', 'EGSS': 'London Stansted',
            'PMI': 'Palma de Mallorca', 'LEPA': 'Palma de Mallorca',
            'BCN': 'Barcelona', 'LEBL': 'Barcelona',
            'MAD': 'Madrid', 'LEMD': 'Madrid',
            'AGP': 'Málaga', 'LEMG': 'Málaga',
            'ALC': 'Alicante', 'LEAL': 'Alicante',
            'LIS': 'Lissabon', 'LPPT': 'Lissabon',
            'FAO': 'Faro', 'LPFR': 'Faro',
            'FCO': 'Rom', 'LIRF': 'Rom',
            'MXP': 'Mailand', 'LIMC': 'Mailand',
            'BGY': 'Mailand Bergamo', 'LIME': 'Mailand Bergamo',
            'VCE': 'Venedig', 'LIPZ': 'Venedig',
            'NAP': 'Neapel', 'LIRN': 'Neapel',
            'ATH': 'Athen', 'LGAV': 'Athen',
            'HER': 'Heraklion/Kreta', 'LGIR': 'Heraklion/Kreta',
            'RHO': 'Rhodos', 'LGRP': 'Rhodos',
            'CFU': 'Korfu', 'LGKR': 'Korfu',
            'AYT': 'Antalya', 'LTAI': 'Antalya',
            'IST': 'Istanbul', 'LTFM': 'Istanbul',
            'SAW': 'Istanbul Sabiha Gökçen', 'LTFJ': 'Istanbul Sabiha Gökçen',
            'ADB': 'Izmir', 'LTBJ': 'Izmir',
            'DLM': 'Dalaman', 'LTBS': 'Dalaman',
            'BUD': 'Budapest', 'LHBP': 'Budapest',
            'WAW': 'Warschau', 'EPWA': 'Warschau',
            'CPH': 'Kopenhagen', 'EKCH': 'Kopenhagen',
            'OSL': 'Oslo', 'ENGM': 'Oslo',
            'ARN': 'Stockholm', 'ESSA': 'Stockholm',
            'HEL': 'Helsinki', 'EFHK': 'Helsinki',
            'DUB': 'Dublin', 'EIDW': 'Dublin'
        };

        function playRadarPing(isStuttgartLanding = false) {
            const soundEnabled = document.getElementById('soundToggle').checked;
            if (!soundEnabled) return;

            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sine';

                if (isStuttgartLanding) {
                    osc.frequency.setValueAtTime(1320, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.35);
                    gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
                    osc.stop(audioCtx.currentTime + 0.35);
                } else {
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
                    osc.stop(audioCtx.currentTime + 0.25);
                }

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();

            } catch (e) {
                // AudioContext eventuell blockiert
            }
        }

        function toggleErrorLog() {
            const modal = document.getElementById('error-log-modal');
            modal.style.display = (modal.style.display === 'block') ? 'none' : 'block';
        }

        function logError(message) {
            const logDiv = document.getElementById('error-log-content');
            const time = new Date().toLocaleTimeString();
            if (logDiv.textContent === "Keine Fehler vorhanden.") logDiv.textContent = "";
            logDiv.textContent = `[${time}] ${message}\n` + logDiv.textContent;
            console.error(message);
        }

        const map = L.map('map', { zoomControl: false }).setView([CONFIG.lat, CONFIG.lon], 12);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        const markers = {};
        const traces = {};

        function centerMap() {
            map.setView([CONFIG.lat, CONFIG.lon], 12);
        }

        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1) + " km";
        }

        function formatAirport(code) {
            if (!code) return '';
            const cleanCode = code.trim().toUpperCase();
            const city = AIRPORT_CITIES[cleanCode];
            return city ? `${cleanCode} (${city})` : cleanCode;
        }

        async function fetchRouteInfo(callsign, routeTdId, trElement, hex) {
            if (!callsign || callsign === 'N/A' || callsign.length < 2) return;

            const cleanCallsign = callsign.trim().toUpperCase();

            if (routeCache[cleanCallsign]) {
                applyRouteToUi(routeCache[cleanCallsign], routeTdId, trElement, hex);
                return;
            }

            // Quelle 1: HexDB via CORS-Proxy
            try {
                const res = await fetch(`https://corsproxy.io/?https://hexdb.io/api/v1/route/callsign/${encodeURIComponent(cleanCallsign)}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.origin && data.destination) {
                        const originStr = formatAirport(data.origin);
                        const destStr = formatAirport(data.destination);
                        const destClean = data.destination.trim().toUpperCase();
                        
                        const isDestStuttgart = (destClean === 'STR' || destClean === 'EDDS' || destStr.includes('Stuttgart'));

                        const routeObj = {
                            formatted: `${originStr} → ${destStr}`,
                            isDestStuttgart: isDestStuttgart
                        };

                        routeCache[cleanCallsign] = routeObj;
                        applyRouteToUi(routeObj, routeTdId, trElement, hex);
                        return;
                    }
                }
            } catch (e) {
                // Weiter zu Quelle 2
            }

            // Quelle 2: ADSB.lol API
            try {
                const resLol = await fetch(`https://api.adsb.lol/v2/callsign/${encodeURIComponent(cleanCallsign)}`);
                if (resLol.ok) {
                    const dataLol = await resLol.json();
                    if (dataLol && dataLol.route) {
                        const orig = dataLol.route._origin || dataLol.route.origin;
                        const dest = dataLol.route._destination || dataLol.route.destination;
                        if (orig && dest) {
                            const originStr = formatAirport(orig);
                            const destStr = formatAirport(dest);
                            const destClean = dest.trim().toUpperCase();
                            const isDestStuttgart = (destClean === 'STR' || destClean === 'EDDS' || destStr.includes('Stuttgart'));

                            const routeObj = {
                                formatted: `${originStr} → ${destStr}`,
                                isDestStuttgart: isDestStuttgart
                            };

                            routeCache[cleanCallsign] = routeObj;
                            applyRouteToUi(routeObj, routeTdId, trElement, hex);
                            return;
                        }
                    }
                }
            } catch (e) {
                // Beide Quellen fehlgeschlagen
            }

            routeCache[cleanCallsign] = { formatted: 'Unbekannt', isDestStuttgart: false };
            applyRouteToUi(routeCache[cleanCallsign], routeTdId, trElement, hex);
        }

        function applyRouteToUi(routeObj, routeTdId, trElement, hex) {
            const td = document.getElementById(routeTdId);
            if (td) {
                td.textContent = routeObj.formatted;
            }
            if (routeObj.isDestStuttgart) {
                if (trElement) trElement.classList.add('highlight-str');
                
                if (hex && !strSoundPlayed.has(hex)) {
                    strSoundPlayed.add(hex);
                    playRadarPing(true);
                }
            }
        }

        async function loadPlanePhoto(hex, imgId) {
            const img = document.getElementById(imgId);
            if (!img) return;

            if (photoCache[hex] !== undefined) {
                img.src = photoCache[hex];
                return;
            }

            try {
                const res = await fetch(`https://api.planespotters.net/pub/photos/hex/${hex}`);
                if (res.ok) {
                    const data = await res.json();
                    if (data.photos && data.photos.length > 0) {
                        photoCache[hex] = data.photos[0].thumbnail_large.src;
                        img.src = photoCache[hex];
                        return;
                    }
                }
            } catch (e) {
                // Fallback
            }

            photoCache[hex] = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='30'><rect width='100%' height='100%' fill='%23222'/><text x='50%' y='55%' fill='%23666' font-size='9' text-anchor='middle' dominant-baseline='central'>Kein</text></svg>";
            img.src = photoCache[hex];
        }

        async function fetchFlightData() {
            try {
                const workerUrl = `https://flugradar-proxy.nicolaiwue.workers.dev/v2/point/${CONFIG.lat}/${CONFIG.lon}/${radiusNmi}`;
                
                const response = await fetch(workerUrl);
                if (!response.ok) {
                    throw new Error(`HTTP Fehler! Status: ${response.status}`);
                }

                const data = await response.json();
                const flights = data.ac || [];

                updateRadarAndTable(flights);
                
                document.getElementById('status-text').textContent = `${flights.length} Flugzeuge`;
                document.getElementById('status-dot').style.backgroundColor = '#4CAF50';

            } catch (error) {
                logError(error.message);
                
                document.getElementById('status-text').textContent = "Fehler";
                document.getElementById('status-dot').style.backgroundColor = '#f44336';
            }
        }

        function updateRadarAndTable(flights) {
            const activeHexes = new Set();
            const tbody = document.getElementById('flight-table-body');
            tbody.innerHTML = '';

            if (flights.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #666; padding: 30px;">Keine Flugzeuge im aktuellen Umkreis (10 km).</td></tr>`;
            }

            flights.forEach(flight => {
                if (!flight.hex) return;
                
                if (!markers[flight.hex]) {
                    playRadarPing(false);
                }

                activeHexes.add(flight.hex);

                const callsign = flight.flight ? flight.flight.trim() : flight.hex;
                
                let alt = 'N/A';
                if (flight.alt_baro !== undefined && flight.alt_baro !== null) {
                    if (typeof flight.alt_baro === 'number') {
                        alt = Math.round(flight.alt_baro * 0.3048) + ' m';
                    } else if (flight.alt_baro === 'ground') {
                        alt = 'Boden';
                    } else {
                        alt = flight.alt_baro;
                    }
                }

                const speedKmh = flight.gs ? Math.round(flight.gs * 1.852) + ' km/h' : 'N/A';
                
                let dist = 'N/A';
                if (flight.lat && flight.lon) {
                    dist = calculateDistance(CONFIG.lat, CONFIG.lon, flight.lat, flight.lon);
                }

                const imgId = `photo-${flight.hex}`;
                const routeTdId = `route-${flight.hex}`;

                const tr = document.createElement('tr');

                tr.innerHTML = `
                    <td><strong>${callsign}</strong></td>
                    <td><img id="${imgId}" class="plane-thumb" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='30'><rect width='100%' height='100%' fill='%23222'/><text x='50%' y='55%' fill='%23666' font-size='9' text-anchor='middle' dominant-baseline='central'>...</text></svg>"></td>
                    <td id="${routeTdId}">Lade Route...</td>
                    <td>${alt}</td>
                    <td>${speedKmh}</td>
                    <td>${dist}</td>
                `;
                tbody.appendChild(tr);

                loadPlanePhoto(flight.hex, imgId);
                fetchRouteInfo(callsign, routeTdId, tr, flight.hex);

                if (flight.lat && flight.lon) {
                    const pos = [flight.lat, flight.lon];

                    if (!traces[flight.hex]) {
                        traces[flight.hex] = L.polyline([pos], { color: '#2196F3', weight: 2, opacity: 0.7 }).addTo(map);
                    } else {
                        const latlngs = traces[flight.hex].getLatLngs();
                        latlngs.push(pos);
                        if (latlngs.length > 30) latlngs.shift();
                        traces[flight.hex].setLatLngs(latlngs);
                    }

                    const heading = (flight.track !== undefined && flight.track !== null) ? flight.track : 0;
                    
                    const iconHtml = `
                        <div style="transform: rotate(${heading}deg); transition: transform 0.4s ease; display: flex; align-items: center; justify-content: center; width: 26px; height: 26px;">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="#2196F3" style="filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));">
                                <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
                            </svg>
                        </div>`;

                    if (!markers[flight.hex]) {
                        const icon = L.divIcon({ className: 'plane-icon', html: iconHtml, iconSize: [26, 26], iconAnchor: [13, 13] });
                        markers[flight.hex] = L.marker(pos, { icon: icon }).addTo(map)
                            .bindPopup(`<b>Callsign:</b> ${callsign}<br><b>Höhe:</b> ${alt}<br><b>Geschw.:</b> ${speedKmh}`);
                    } else {
                        markers[flight.hex].setLatLng(pos);
                        markers[flight.hex].setIcon(L.divIcon({ className: 'plane-icon', html: iconHtml, iconSize: [26, 26], iconAnchor: [13, 13] }));
                        markers[flight.hex].setPopupContent(`<b>Callsign:</b> ${callsign}<br><b>Höhe:</b> ${alt}<br><b>Geschw.:</b> ${speedKmh}`);
                    }
                }
            });

            for (const hex in markers) {
                if (!activeHexes.has(hex)) {
                    map.removeLayer(markers[hex]);
                    if (traces[hex]) map.removeLayer(traces[hex]);
                    delete markers[hex];
                    delete traces[hex];
                    strSoundPlayed.delete(hex);
                }
            }
        }

        fetchFlightData();
        setInterval(fetchFlightData, 3000);
    </script>
</body>
</html>
