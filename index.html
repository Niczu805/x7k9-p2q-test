<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugzeugradar</title>
    
    <!-- Leaflet CSS für die Karte -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background-color: #1a1a1a;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
            z-index: 1000;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #bbb;
        }
        /* Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: inline-block;
        }

        /* Karten-Container nimmt den restlichen Bildschirm ein */
        #map {
            position: absolute;
            top: 50px;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #121212;
            z-index: 1;
        }

        /* Zentrieren Button */
        .center-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .center-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>✈️</span> Flugzeugradar
        </div>
        <div class="header-controls">
            <div class="control-item">
                <span>Ton</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="status-indicator">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Lade...</span>
            </div>
        </div>
    </header>

    <!-- Die interaktive Karte -->
    <div id="map"></div>

    <button class="center-btn" onclick="centerMap()">
        🎯 Zentrieren
    </button>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Deine Koordinaten (Region Stuttgart)
        const CONFIG = {
            lat: 48.6913,
            lon: 9.1843
        };

        const radiusNmi = 20; // Umkreis in nautischen Meilen

        // Karte initialisieren (Dunkles Theme passend zum Radar)
        const map = L.map('map', {
            zoomControl: false
        }).setView([CONFIG.lat, CONFIG.lon], 10);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // Marker- und Trace-Speicher
        const markers = {};
        const traces = {};

        function centerMap() {
            map.setView([CONFIG.lat, CONFIG.lon], 10);
        }

        async function fetchFlightData() {
            try {
                const workerUrl = `https://flugradar-proxy.nicolaiwue.workers.dev/v2/point/${CONFIG.lat}/${CONFIG.lon}/${radiusNmi}`;
                
                const response = await fetch(workerUrl);
                if (!response.ok) {
                    throw new Error(`HTTP Status: ${response.status}`);
                }

                const data = await response.json();
                const flights = data.ac || [];

                updateRadar(flights);
                
                document.getElementById('status-text').textContent = `${flights.length} Flugzeuge`;
                document.getElementById('status-dot').style.backgroundColor = '#4CAF50';

            } catch (error) {
                console.error("Fehler beim Abrufen:", error);
                document.getElementById('status-text').textContent = "Fehler";
                document.getElementById('status-dot').style.backgroundColor = '#f44336';
            }
        }

        function updateRadar(flights) {
            const activeHexes = new Set();

            flights.forEach(flight => {
                if (!flight.lat || !flight.lon || !flight.hex) return;
                
                activeHexes.add(flight.hex);
                const pos = [flight.lat, flight.lon];
                const callsign = flight.flight ? flight.flight.trim() : flight.hex;

                // Trace (Pfad) aktualisieren
                if (!traces[flight.hex]) {
                    traces[flight.hex] = L.polyline([pos], { color: '#2196F3', weight: 2, opacity: 0.7 }).addTo(map);
                } else {
                    const latlngs = traces[flight.hex].getLatLngs();
                    latlngs.push(pos);
                    if (latlngs.length > 30) latlngs.shift(); // Max 30 Punkte behalten
                    traces[flight.hex].setLatLngs(latlngs);
                }

                // Marker aktualisieren oder erstellen
                if (!markers[flight.hex]) {
                    const icon = L.divIcon({
                        className: 'plane-icon',
                        html: `<div style="transform: rotate(${flight.track || 0}deg); font-size: 16px;">✈️</div>`,
                        iconSize: [20, 20],
                        iconAnchor: [10, 10]
                    });

                    markers[flight.hex] = L.marker(pos, { icon: icon }).addTo(map)
                        .bindPopup(`<b>Callsign:</b> ${callsign}<br><b>Höhe:</b> ${flight.alt_baro || 'N/A'} ft<br><b>Speed:</b> ${flight.gs || 'N/A'} kn`);
                } else {
                    markers[flight.hex].setLatLng(pos);
                    // Popup-Inhalt aktualisieren
                    markers[flight.hex].setPopupContent(`<b>Callsign:</b> ${callsign}<br><b>Höhe:</b> ${flight.alt_baro || 'N/A'} ft<br><b>Speed:</b> ${flight.gs || 'N/A'} kn`);
                }
            });

            // Alte Flugzeuge entfernen, die nicht mehr im Feed sind
            for (const hex in markers) {
                if (!activeHexes.has(hex)) {
                    map.removeLayer(markers[hex]);
                    map.removeLayer(traces[hex]);
                    delete markers[hex];
                    delete traces[hex];
                }
            }
        }

        // Start und Intervall (alle 10 Sekunden)
        fetchFlightData();
        setInterval(fetchFlightData, 10000);
    </script>
</body>
</html>
