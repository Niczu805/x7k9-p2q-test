<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugzeugradar</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 12px 20px;
            text-align: left;
            border-bottom: 1px solid #222;
        }
        th {
            color: #888;
            font-size: 13px;
            text-transform: uppercase;
        }
        #status-container {
            padding: 40px;
            text-align: center;
            color: #888;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2a2a2a;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h2 style="margin: 0; font-size: 18px;">✈️ Flugzeugradar</h2>
        <div class="status-badge">
            <span id="status-dot" style="color: orange;">●</span> 
            <span id="status-text">Lade...</span>
        </div>
    </header>

    <table>
        <thead>
            <tr>
                <th>CALLSIGN</th>
                <th>FOTO</th>
                <th>ROUTE</th>
                <th>HÖHE</th>
                <th>GESCHW.</th>
                <th>DISTANZ</th>
            </tr>
        </thead>
        <tbody id="flight-table-body">
            <!-- Dynamische Einträge -->
        </tbody>
    </table>

    <div id="status-container">
        <p id="info-message">Suche nach Live-Flugdaten...</p>
    </div>

    <script>
        // Deine Koordinaten (z.B. Region Stuttgart)
        const CONFIG = {
            lat: 48.6913,
            lon: 9.1843
        };

        const radiusNmi = 20; // Umkreis in nautischen Meilen

        function updateStatus(text, color) {
            document.getElementById('status-text').textContent = text;
            document.getElementById('status-dot').style.color = color;
        }

        async function fetchFlightData() {
            try {
                // WICHTIG: Korrekter Endpunkt /v2/point/ statt /v2/lat/
                const workerUrl = `https://flugradar-proxy.nicolaiwue.workers.dev/v2/point/${CONFIG.lat}/${CONFIG.lon}/${radiusNmi}`;
                
                const response = await fetch(workerUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP Status: ${response.status}`);
                }

                const data = await response.json();
                const flights = data.ac || [];

                renderFlights(flights);
                updateStatus(`${flights.length} Flugzeuge`, 'limegreen');
                document.getElementById('info-message').textContent = flights.length === 0 ? "Keine Flugzeuge im aktuellen Umkreis." : "";

            } catch (error) {
                console.error("Fehler beim Abrufen:", error);
                updateStatus("Fehler", 'red');
                document.getElementById('info-message').textContent = `Fehler beim Abrufen über Cloudflare: HTTP Status: 404`;
            }
        }

        function renderFlights(flights) {
            const tbody = document.getElementById('flight-table-body');
            tbody.innerHTML = '';

            flights.forEach(flight => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${flight.flight ? flight.flight.trim() : (flight.hex || 'Unbekannt')}</td>
                    <td>-</td>
                    <td>-</td>
                    <td>${flight.alt_baro ? flight.alt_baro + ' ft' : 'N/A'}</td>
                    <td>${flight.gs ? flight.gs + ' kn' : 'N/A'}</td>
                    <td>-</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initialer Aufruf und Intervall alle 10 Sekunden
        fetchFlightData();
        setInterval(fetchFlightData, 10000);
    </script>
</body>
</html>
