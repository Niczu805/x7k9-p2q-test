<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flugzeugradar</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        header {
            background-color: #1a1a1a;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2a2a;
        }
        .header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
        }
        .header-controls {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 13px;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #bbb;
        }
        /* Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 20px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider {
            background-color: #2196F3;
        }
        input:checked + .slider:before {
            transform: translateX(16px);
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .dot {
            height: 8px;
            width: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: inline-block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 0;
        }
        th, td {
            padding: 12px 20px;
            text-align: left;
            border-bottom: 1px solid #1f1f1f;
            font-size: 13px;
        }
        th {
            color: #777;
            font-size: 11px;
            text-transform: uppercase;
            background-color: #161616;
            letter-spacing: 0.5px;
        }
        tr:hover {
            background-color: #181818;
        }
        
        #info-container {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 14px;
        }

        /* Zentrieren Button */
        .center-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #2a2a2a;
            color: white;
            border: 1px solid #444;
            padding: 8px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .center-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="header-title">
            <span>✈️</span> Flugzeugradar
        </div>
        <div class="header-controls">
            <div class="control-item">
                <span>Ton</span>
                <label class="switch">
                    <input type="checkbox" id="soundToggle">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="status-indicator">
                <span class="dot" id="status-dot"></span>
                <span id="status-text">Lade...</span>
            </div>
        </div>
    </header>

    <table>
        <thead>
            <tr>
                <th>CALLSIGN</th>
                <th>FOTO</th>
                <th>ROUTE</th>
                <th>HÖHE</th>
                <th>GESCHW.</th>
                <th>DISTANZ</th>
            </tr>
        </thead>
        <tbody id="flight-table-body">
            <!-- Dynamische Einträge -->
        </tbody>
    </table>

    <div id="info-container">
        <p id="info-message">Suche nach Live-Flugdaten...</p>
    </div>

    <button class="center-btn" onclick="location.reload()">
        🎯 Zentrieren
    </button>

    <script>
        // Deine Koordinaten (z.B. Region Stuttgart)
        const CONFIG = {
            lat: 48.6913,
            lon: 9.1843
        };

        const radiusNmi = 20; // Umkreis in nautischen Meilen

        async function fetchFlightData() {
            try {
                // Korrekter Worker-Endpunkt mit /v2/point/
                const workerUrl = `https://flugradar-proxy.nicolaiwue.workers.dev/v2/point/${CONFIG.lat}/${CONFIG.lon}/${radiusNmi}`;
                
                const response = await fetch(workerUrl);
                
                if (!response.ok) {
                    throw new Error(`HTTP Status: ${response.status}`);
                }

                const data = await response.json();
                const flights = data.ac || [];

                renderFlights(flights);
                
                document.getElementById('status-text').textContent = `${flights.length} Flugzeuge`;
                document.getElementById('status-dot').style.backgroundColor = '#4CAF50';
                
                const infoMsg = document.getElementById('info-message');
                if (flights.length === 0) {
                    infoMsg.textContent = "Keine Flugzeuge im aktuellen Umkreis.";
                    infoMsg.style.display = "block";
                } else {
                    infoMsg.style.display = "none";
                }

            } catch (error) {
                console.error("Fehler beim Abrufen:", error);
                document.getElementById('status-text').textContent = "Fehler";
                document.getElementById('status-dot').style.backgroundColor = '#f44336';
                document.getElementById('info-message').textContent = "Fehler beim Laden der Live-Flugdaten.";
            }
        }

        function renderFlights(flights) {
            const tbody = document.getElementById('flight-table-body');
            tbody.innerHTML = '';

            flights.forEach(flight => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${flight.flight ? flight.flight.trim() : (flight.hex || 'Unbekannt')}</strong></td>
                    <td>-</td>
                    <td>-</td>
                    <td>${flight.alt_baro ? flight.alt_baro + ' ft' : 'N/A'}</td>
                    <td>${flight.gs ? flight.gs + ' kn' : 'N/A'}</td>
                    <td>-</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Initial abrufen und alle 10 Sekunden aktualisieren
        fetchFlightData();
        setInterval(fetchFlightData, 10000);
    </script>
</body>
</html>
