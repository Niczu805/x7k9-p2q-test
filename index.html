<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Flugzeugradar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b0f14;
    color: #e6edf3;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #11161d;
    border-bottom: 1px solid #232b35;
    flex-shrink: 0;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header .status { 
    font-size: 11px; 
    color: #8b98a5; 
    display: flex; 
    gap: 8px; 
    align-items: center; 
  }
  .status-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    color: inherit;
    font: inherit;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    transition: background-color 0.2s;
  }
  .status-btn:hover { background-color: #1c2229; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fb950; display: inline-block; }
  .dot.loading { background: #d29922; }
  .dot.error { background: #f85149; }
  main { flex: 1; display: flex; min-height: 0; flex-direction: column; }
  #map { height: 35vh; width: 100%; background: #11161d; }
  #list { flex: 1; overflow-y: auto; background: #0d1117; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #1c2229; white-space: nowrap; vertical-align: middle; }
  th { position: sticky; top: 0; background: #11161d; color: #8b98a5; font-size: 11px; text-transform: uppercase; }
  tr:hover { background: #161b22; }
  .route { color: #58a6ff; }
  .route .arrow { color: #566270; margin: 0 4px; }
  .muted { color: #6e7681; }
  .empty { padding: 20px; text-align: center; color: #8b98a5; font-size: 13px; }

  /* Styling für Karten-Icons und Flugzeugfotos */
  .plane-marker { background: transparent !important; border: none !important; }
  .plane-thumb {
    width: 44px;
    height: 30px;
    object-fit: cover;
    border-radius: 4px;
    border: 1px solid #30363d;
    display: block;
    background: #161b22;
  }
  
  /* Modal / Fehlerprotokoll-Fenster */
  .modal-backdrop {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0, 0, 0, 0.7);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    max-width: 600px;
    width: 100%;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  .modal-header {
    padding: 12px 16px;
    border-bottom: 1px solid #21262d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-header h3 { font-size: 14px; color: #f0f6fc; }
  .modal-close {
    background: transparent;
    border: none;
    color: #8b98a5;
    font-size: 18px;
    cursor: pointer;
  }
  .modal-body {
    padding: 16px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 11px;
    color: #f85149;
    white-space: pre-wrap;
    word-break: break-all;
    background: #0d1117;
  }
</style>
</head>
<body>

<header>
  <h1>✈️ Flugzeugradar</h1>
  <div class="status">
    <button class="status-btn" id="statusBtn" title="Klicken für Status / Fehlerprotokoll">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Lade…</span>
    </button>
    <span id="countText">0 Flugzeuge</span>
  </div>
</header>

<main>
  <div id="map"></div>
  <div id="list">
    <table>
      <thead>
        <tr>
          <th>Callsign</th>
          <th>Foto</th>
          <th>Route</th>
          <th>Höhe</th>
          <th>Geschw.</th>
          <th>Distanz</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="emptyMsg">Suche nach Live-Flugdaten...</div>
  </div>
</main>

<!-- Modal für das Fehlerprotokoll -->
<div class="modal-backdrop" id="errorModal">
  <div class="modal">
    <div class="modal-header">
      <h3>📋 Diagnose & Fehlerprotokoll</h3>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div class="modal-body" id="errorLog">Keine Fehler vorhanden.</div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CONFIG = {
  lat: 48.69, // Auf 2 Nachkommastellen gerundet
  lon: 9.16,  // Auf 2 Nachkommastellen gerundet
  radiusKm: 20,
  refreshSeconds: 15
};

const routeCache = new Map();
const photoCache = new Map();
const errorLogs = [];
let lastSuccessfulFlights = null;
let consecutiveErrors = 0;

function logError(msg) {
  const timestamp = new Date().toLocaleTimeString('de-DE');
  const entry = `[${timestamp}] ${msg}`;
  errorLogs.unshift(entry);
  if (errorLogs.length > 20) errorLogs.pop();
  
  const logElem = document.getElementById('errorLog');
  if (logElem) logElem.textContent = errorLogs.join('\n\n');
}

function setStatus(state, text) {
  const dot = document.getElementById('statusDot');
  const t = document.getElementById('statusText');
  if (dot) dot.className = 'dot' + (state === 'ok' ? '' : ' ' + state);
  if (t) t.textContent = text;
}

// Modal Event Listener
document.getElementById('statusBtn').addEventListener('click', () => {
  document.getElementById('errorModal').classList.add('active');
});
document.getElementById('modalCloseBtn').addEventListener('click', () => {
  document.getElementById('errorModal').classList.remove('active');
});
document.getElementById('errorModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('errorModal')) {
    document.getElementById('errorModal').classList.remove('active');
  }
});

function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function createPlaneIcon(heading) {
  const h = typeof heading === 'number' ? heading : 0;
  return L.divIcon({
    className: 'plane-marker',
    html: `<svg width="24" height="24" viewBox="0 0 24 24" fill="#58a6ff" style="transform: rotate(${h}deg); filter: drop-shadow(0 0 3px rgba(0,0,0,0.9)); display: block;"><path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg>`,
    iconSize: [24, 24],
    iconAnchor: [12, 12]
  });
}

let map = null;
const markers = new Map();

window.addEventListener('DOMContentLoaded', () => {
  try {
    if (window.L) {
      map = L.map('map', { zoomControl: false }).setView([CONFIG.lat, CONFIG.lon], 10);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);
      L.marker([CONFIG.lat, CONFIG.lon]).addTo(map).bindPopup('Standort');
    }
  } catch(e) {
    logError("Karten-Initialisierungsfehler: " + e.message);
  }
  
  refresh();
  setInterval(refresh, CONFIG.refreshSeconds * 1000);
});

async function fetchRoute(callsign) {
  const cs = callsign.trim();
  if (!cs) return null;
  if (routeCache.has(cs)) return routeCache.get(cs);
  try {
    const res = await fetch(`https://api.adsbdb.com/v0/callsign/${encodeURIComponent(cs)}`);
    if (!res.ok) { routeCache.set(cs, null); return null; }
    const data = await res.json();
    const fr = data && data.response && data.response.flightroute;
    if (!fr) { routeCache.set(cs, null); return null; }
    
    const formatAirport = (ap) => {
      if (!ap) return null;
      const code = ap.iata_code || ap.icao_code || '';
      const city = ap.municipality || ap.name || '';
      if (code && city) return `${code} (${city})`;
      return code || city || null;
    };

    const result = {
      origin: formatAirport(fr.origin),
      destination: formatAirport(fr.destination)
    };
    routeCache.set(cs, result);
    return result;
  } catch (e) {
    routeCache.set(cs, null);
    return null;
  }
}

async function fetchPhoto(hex) {
  if (!hex) return null;
  if (photoCache.has(hex)) return photoCache.get(hex);
  try {
    const res = await fetch(`https://api.planespotters.net/pub/photos/hex/${hex}`);
    if (!res.ok) { photoCache.set(hex, null); return null; }
    const data = await res.json();
    if (data && data.photos && data.photos.length > 0) {
      const src = data.photos[0].thumbnail_large ? data.photos[0].thumbnail_large.src : data.photos[0].thumbnail.src;
      photoCache.set(hex, src);
      return src;
    }
    photoCache.set(hex, null);
    return null;
  } catch (e) {
    photoCache.set(hex, null);
    return null;
  }
}

async function fetchAircraftData() {
  const latDelta = CONFIG.radiusKm / 111.0;
  const lonDelta = CONFIG.radiusKm / (111.0 * Math.cos(CONFIG.lat * Math.PI / 180));

  const latMin = (CONFIG.lat - latDelta).toFixed(4);
  const latMax = (CONFIG.lat + latDelta).toFixed(4);
  const lonMin = (CONFIG.lon - lonDelta).toFixed(4);
  const lonMax = (CONFIG.lon + lonDelta).toFixed(4);
  const radiusNmi = (CONFIG.radiusKm / 1.852).toFixed(1);

  const sources = [
    {
      name: 'OpenSky Direct',
      url: `https://opensky-network.org/api/states/all?lamin=${latMin}&lamax=${latMax}&lomin=${lonMin}&lomax=${lonMax}`,
      parse: (d) => (d.states || []).map(s => ({
        hex: s[0],
        flight: s[1] ? s[1].trim() : '',
        lat: s[6],
        lon: s[5],
        alt_baro: typeof s[7] === 'number' ? Math.round(s[7] * 3.28084) : 0,
        gs: typeof s[9] === 'number' ? Math.round(s[9] * 1.94384) : 0,
        track: typeof s[10] === 'number' ? Math.round(s[10]) : 0
      }))
    },
    {
      name: 'CodeTabs Proxy (ADSB.lol)',
      url: `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(`https://api.adsb.lol/v2/point/${CONFIG.lat}/${CONFIG.lon}/${radiusNmi}`)}`,
      parse: (d) => (d.ac || []).map(f => ({ ...f, track: f.track || f.nav_heading || 0 }))
    },
    {
      name: 'AllOrigins Proxy (ADSB.lol)',
      url: `https://api.allorigins.win/raw?url=${encodeURIComponent(`https://api.adsb.lol/v2/point/${CONFIG.lat}/${CONFIG.lon}/${radiusNmi}`)}`,
      parse: (d) => (d.ac || []).map(f => ({ ...f, track: f.track || f.nav_heading || 0 }))
    }
  ];

  for (const src of sources) {
    try {
      const res = await fetch(src.url);
      if (res.ok) {
        const data = await res.json();
        const parsed = src.parse(data);
        if (Array.isArray(parsed)) return parsed;
      } else {
        logError(`${src.name} HTTP Status: ${res.status}`);
      }
    } catch (e) {
      logError(`${src.name} Netzwerkfehler: ${e.message}`);
    }
  }

  throw new Error("Alle Datenquellen temporär unerreichbar.");
}

function renderFlights(flights) {
  if (map) {
    const seen = new Set();
    for (const f of flights) {
      seen.add(f.hex);
      const icon = createPlaneIcon(f.track);
      if (markers.has(f.hex)) {
        const m = markers.get(f.hex);
        m.setLatLng([f.lat, f.lon]);
        m.setIcon(icon);
      } else {
        const m = L.marker([f.lat, f.lon], { icon: icon }).addTo(map);
        markers.set(f.hex, m);
      }
    }
    for (const [hex, m] of markers) {
      if (!seen.has(hex)) { map.removeLayer(m); markers.delete(hex); }
    }
  }

  const tbody = document.getElementById('tbody');
  const emptyMsg = document.getElementById('emptyMsg');
  if (tbody) tbody.innerHTML = '';
  
  if (emptyMsg) {
    if (flights.length === 0) {
      emptyMsg.style.display = 'block';
      emptyMsg.textContent = 'Kein Flugverkehr im Umkreis erfasst.';
    } else {
      emptyMsg.style.display = 'none';
    }
  }

  const countElem = document.getElementById('countText');
  if (countElem) countElem.textContent = `${flights.length} Flugzeuge`;

  for (const f of flights) {
    if (!tbody) break;
    const tr = document.createElement('tr');
    const speedKm = Math.round(f.speedKt * 1.852);
    const altFmt = f.altFt > 0 ? `${f.altFt.toLocaleString('de-DE')} ft` : 'Boden';

    tr.innerHTML = `
      <td>✈️ ${f.callsign || '<span class="muted">' + f.hex + '</span>'}</td>
      <td id="photo-${f.hex}"><span class="muted">lade…</span></td>
      <td class="route" id="route-${f.hex}"><span class="muted">lade…</span></td>
      <td>${altFmt}</td>
      <td>${speedKm} km/h</td>
      <td>${f.distKm.toFixed(1)} km</td>
    `;

    tbody.appendChild(tr);

    // Foto abrufen
    fetchPhoto(f.hex).then(photoUrl => {
      const cell = document.getElementById(`photo-${f.hex}`);
      if (!cell) return;
      if (photoUrl) {
        cell.innerHTML = `<a href="${photoUrl}" target="_blank" rel="noopener"><img src="${photoUrl}" alt="Flugzeug" class="plane-thumb" /></a>`;
      } else {
        cell.innerHTML = '<span class="muted">–</span>';
      }
    });

    // Route abrufen
    if (f.callsign) {
      fetchRoute(f.callsign).then(route => {
        const cell = document.getElementById(`route-${f.hex}`);
        if (!cell) return;
        if (route && route.origin && route.destination) {
          cell.innerHTML = `${route.origin}<span class="arrow">→</span>${route.destination}`;
        } else {
          cell.innerHTML = '<span class="muted">k.A.</span>';
        }
      });
    } else {
      const cell = document.getElementById(`route-${f.hex}`);
      if (cell) cell.innerHTML = '<span class="muted">–</span>';
    }
  }
}

async function refresh() {
  setStatus('loading', 'Lade Daten…');

  let acList = null;
  try {
    acList = await fetchAircraftData();
    consecutiveErrors = 0;
  } catch (e) {
    consecutiveErrors++;
    logError(`Fehler bei Abrufversuch ${consecutiveErrors}: ${e.message}`);
    
    if (lastSuccessfulFlights && consecutiveErrors < 3) {
      setStatus('loading', `Puffere Daten (${consecutiveErrors}/3)…`);
      renderFlights(lastSuccessfulFlights);
      return;
    } else {
      setStatus('error', 'Verbindungsfehler (Klick für Info)');
      return;
    }
  }

  const flights = acList
    .filter(f => f && typeof f.lat === 'number' && typeof f.lon === 'number')
    .map(f => {
      const dist = haversineKm(CONFIG.lat, CONFIG.lon, f.lat, f.lon);
      return {
        hex: f.hex,
        callsign: (f.flight || '').trim(),
        lat: f.lat,
        lon: f.lon,
        altFt: (f.alt_baro !== "ground" && typeof f.alt_baro === 'number') ? f.alt_baro : 0,
        speedKt: typeof f.gs === 'number' ? f.gs : 0,
        track: typeof f.track === 'number' ? f.track : 0,
        distKm: dist
      };
    })
    .filter(f => f.distKm <= CONFIG.radiusKm)
    .sort((a, b) => a.distKm - b.distKm);

  lastSuccessfulFlights = flights;
  renderFlights(flights);
  setStatus('ok', 'Live: ' + new Date().toLocaleTimeString('de-DE'));
}
</script>
</body>
</html>
